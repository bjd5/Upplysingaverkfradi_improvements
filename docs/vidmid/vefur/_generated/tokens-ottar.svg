<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="100%" role="img" aria-labelledby="titill lysing" font-family="system-ui, sans-serif">
<title id="titill">Vikuleg tokennotkun Óttars</title>
<desc id="lysing">Súlurit. Lárétti ásinn sýnir vikur verkefnisins og lóðrétti ásinn fjölda tokena. Hver súla er ein vika og hæð hennar er samanlögð tokennotkun Óttars þá viku.</desc>
